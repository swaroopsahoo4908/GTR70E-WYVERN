<text x="120" y="779.5" fill="#9fb4c4" font-size="14.5">Leave a 25-30 mm service loop each side so the tubes are already moving before the pins take load. Firmware treats 0x4A going quiet after DEPLOY_T as expected, not a fault.</text>
