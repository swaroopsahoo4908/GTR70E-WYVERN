# Full-factorial sweep grid for FullFactorialSweep (Engine 2).
# Every combination of every axis below gets simulated -- no sampling, no skipping.
#
# Your originally-requested increments (0.5 m/s wind, 0.1 m/s std dev, 1% turbulence,
# 0.5 deg direction, 1 deg C, 1 mbar) produce ~388 BILLION combinations -- not runnable
# (see chat: ~369 years on one CPU core). The defaults below produce ~1.63 million
# combinations, which should finish in a few hours on a modern multi-core machine.
#
# Tune these for your own time budget. Run the tool once first -- it prints the total
# combination count and a rough time estimate BEFORE it starts, so you can Ctrl+C and
# adjust before committing to a multi-hour run.

windAvg.min=0
windAvg.max=20
windAvg.step=1.0

windStdDev.min=0
windStdDev.max=5
windStdDev.step=1.0

turbulencePct.min=0
turbulencePct.max=50
turbulencePct.step=10

windDir.min=0
windDir.max=345
windDir.step=15

temp.min=-5
temp.max=35
temp.step=5

pressure.min=980
pressure.max=1020
pressure.step=10

sites=MDRA_SOD_FARM,SPAAR_LANCASTER

# Safety cap: refuses to run above this many combinations unless --force is passed.
maxCombosSafety=5000000

# Worker threads. Defaults to available CPU cores if omitted.
threads=8
