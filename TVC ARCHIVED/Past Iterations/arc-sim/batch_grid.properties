# Design-parameter grid for OrkBatchGenerator (Engine 4).
# Generates ONE .ork file per combination of the axes below -- all land together in a new
# "<orkName>_batch_<timestamp>/" subfolder next to the base .ork, along with a "manifest.csv"
# that links every generated .ork filename to the parameter values (and, if simCheck.* below is
# filled in, the simulated apogee/flight-time) used to produce it.
#
# Leave an axis's three lines OUT ENTIRELY (all three, not just one) to keep that parameter
# exactly as loaded from the base file -- e.g. delete the finSweepM.* lines below to sweep only
# ballast + fin height + hole radius and leave sweep untouched in every generated file.
#
# Units match Engine 3: ballast in kg, fin height/sweep in meters, hole radius in INCHES.

ballastKg.min=0.05
ballastKg.max=0.20
ballastKg.step=0.05

finHeightM.min=0.04
finHeightM.max=0.10
finHeightM.step=0.02

# Fin sweep left unvaried by default -- uncomment to sweep it too.
# finSweepM.min=0.02
# finSweepM.max=0.06
# finSweepM.step=0.02

# Parachute center spill-hole radius -- swept within a small tolerance band around "no hole"
# (0 in) by default, alongside ballast and fin height, per the current design-of-experiments plan.
# Comment all three lines out to leave the hole radius untouched instead.
holeRadiusIn.min=0
holeRadiusIn.max=1.0
holeRadiusIn.step=0.25

# Safety cap: refuses to run above this many output files unless --force is passed.
maxFilesSafety=5000

# ---------------------------------------------------------------------------------------------
# OPTIONAL: simulate + check every generated variant against a target apogee/flight-time window
# under ONE fixed atmosphere, the same target+atmosphere shape Engine 3 (DesignSolver) takes.
# Either fill in ALL 10 of the simCheck.* keys below, or leave ALL of them commented out --
# partially filling them in is a config error and the run will refuse to start.
#
# When filled in: each variant is simulated before being saved (so the saved .ork's own
# Simulation 1 already has real apogee/flight-time cached in it -- open it in the OpenRocket GUI
# and the numbers are already there, the same idea as Engine 1's runs but per design variant
# instead of per atmosphere sample), and manifest.csv gets apogee_m/flight_time_s/meets_apogee/
# meets_time/meets_both columns so you can sort the manifest for variants that actually hit the
# targets without opening any of the individual files.
#
# Example values below match the atmosphere from the original Simulation 2 / Engine 3 example
# (3.8 m/s wind, 13.4% turbulence, ~7 C, ~1000 mbar) and the 243 m / 37.5-39.5 s target -- uncomment
# and adjust for your own target.
#
# simCheck.targetApogeeM=243.0
# simCheck.targetTimeMinS=37.5
# simCheck.targetTimeMaxS=39.5
# simCheck.site=MDRA_SOD_FARM
# simCheck.windAvgMs=3.8
# simCheck.windStdDevMs=0.6
# simCheck.turbulencePct=13.4
# simCheck.windDirDeg=270
# simCheck.tempC=7.06
# simCheck.pressureMbar=999.76
